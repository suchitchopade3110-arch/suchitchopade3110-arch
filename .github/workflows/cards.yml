# Re-renders the README cards once a day with fresh contribution data,
# and whenever data/profile.json or the scripts change.
name: Render README cards

on:
  schedule:
    - cron: "17 1 * * *" # 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.json", "scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render cards and README
        run: python scripts/render_cards.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cards data/contributions.json
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
